# ServiceMonitor — requires prometheus-operator / kube-prometheus-stack
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argus-core-service
  namespace: argus
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: core-service
  endpoints:
    - port: http
      path: /metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argus-telemetry-service
  namespace: argus
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: telemetry-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
# PrometheusRule — alerting rules for Argus
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argus-alerts
  namespace: argus
  labels:
    release: prometheus
spec:
  groups:
    - name: argus.service.health
      rules:
        - alert: ArgusServiceDown
          expr: up{namespace="argus"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Argus service {{ $labels.job }} is down"
            description: "{{ $labels.job }} in namespace argus has been unreachable for more than 2 minutes."
        - alert: ArgusHighErrorRate
          expr: rate(argus_http_requests_total{namespace="argus", status=~"5.."}[5m]) / rate(argus_http_requests_total{namespace="argus"}[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Argus high error rate on {{ $labels.job }}"
            description: "More than 5% of requests are returning 5xx errors for {{ $labels.job }}."
        - alert: ArgusHighLatency
          expr: histogram_quantile(0.95, rate(argus_http_request_duration_seconds_bucket{namespace="argus"}[5m])) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Argus high latency on {{ $labels.job }}"
            description: "P95 request latency is above 2s for {{ $labels.job }}."
