# ServiceMonitor — requires prometheus-operator / kube-prometheus-stack
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argus-core-service
  namespace: argus
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: core-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argus-telemetry-service
  namespace: argus
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: telemetry-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
# PrometheusRule — alerting rules for Argus
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argus-alerts
  namespace: argus
  labels:
    release: prometheus
spec:
  groups:
    - name: argus.service.health
      rules:
        - alert: ArgusServiceDown
          expr: up{namespace="argus"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Argus service {{ $labels.job }} is down"
            description: "{{ $labels.job }} in namespace argus has been unreachable for more than 2 minutes."
        - alert: ArgusHighErrorRate
          expr: rate(http_requests_total{namespace="argus", code=~"5.."}[5m]) / rate(http_requests_total{namespace="argus"}[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Argus high error rate on {{ $labels.job }}"
            description: "More than 5% of requests are returning 5xx errors for {{ $labels.job }}."
        - alert: ArgusHighLatency
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{namespace="argus"}[5m])) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Argus high latency on {{ $labels.job }}"
            description: "P95 request latency is above 2s for {{ $labels.job }}."
    - name: argus.kafka.health
      rules:
        - alert: ArgusKafkaConsumerLag
          expr: kafka_consumer_group_lag{namespace="argus"} > 10000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Argus Kafka consumer lag high"
            description: "Consumer group {{ $labels.consumergroup }} has lag > 10000 on topic {{ $labels.topic }}."
    - name: argus.postgres.health
      rules:
        - alert: ArgusPostgresConnectionsHigh
          expr: pg_stat_activity_count{namespace="argus"} > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Argus Postgres connections high"
            description: "Postgres has {{ $value }} active connections (threshold: 80)."
    - name: argus.device.health
      rules:
        - alert: ArgusDeviceOffline
          expr: time() - argus_device_last_heartbeat_timestamp_seconds{namespace="argus"} > 120
          for: 1m
          labels:
            severity: info
          annotations:
            summary: "Device {{ $labels.device_id }} went offline"
            description: "Device {{ $labels.device_id }} has not sent a heartbeat for over 2 minutes."
    - name: argus.firmware.health
      rules:
        - alert: ArgusOTAFlightFailureRate
          expr: rate(argus_ota_flight_status_total{namespace="argus", status="failed"}[1h]) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High OTA update failure rate"
            description: "OTA flight failure rate is above 10% in the last hour."
