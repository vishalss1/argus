services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: argus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus}
    ports:
      - "5433:5432"
    volumes:
      - argus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argus} -d ${POSTGRES_DB:-argus}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: argus-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  redpanda:
    image: redpandadata/redpanda:v24.3.5
    container_name: argus-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "4"
      - --memory
      - 4G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,EXTERNAL://127.0.0.1:9092
      - --set
      - log_retention_ms=3600000
    ports:
      - "9092:19092"

  redis:
    image: redis:7-alpine
    container_name: argus-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - argus_redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: argus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-argus}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-arguspassword}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - argus_minio_data:/data
      - ../../certs/fullchain.pem:/root/.minio/certs/public.crt:ro
      - ../../certs/privkey.pem:/root/.minio/certs/private.key:ro



  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: argus-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - argus_prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.3.2
    container_name: argus-loki
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - argus_loki_data:/loki

  promtail:
    image: grafana/promtail:3.3.2
    container_name: argus-promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: argus-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-argus}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - argus_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  core-service:
    build:
      context: ../../
      dockerfile: services/core-service/Dockerfile
    container_name: argus-core-service
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgres://argus:argus@postgres:5432/argus?sslmode=disable
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TELEMETRY_TOPIC=telemetry.raw
      - KAFKA_INCIDENT_TOPIC=telemetry.incidents
      - MINIO_ENDPOINT=minio:9000
      - MQTT_BROKER_URL=tcp://mosquitto:1883
      - PORT=8080
      - WORKER_PROFILES=api,telemetry,alerts
      - JWT_ACCESS_EXPIRY=24h
      - TELEMETRY_SERVICE_GRPC_ADDR=telemetry-service:50052
      - GRPC_PORT=50051
      - HTTPS_TLS_CERT_FILE=/certs/fullchain.pem
      - HTTPS_TLS_KEY_FILE=/certs/privkey.pem
      - DEVICE_CA_ROOT_CERT_FILE=/certs/root-ca.pem
      - DEVICE_CA_PRIVATE_KEY_FILE=/certs/root-ca.key
      - SERVER_CA_CERT_FILE=/certs/ca.pem
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_started
      minio:
        condition: service_started
      mosquitto:
        condition: service_started
    volumes:
      - ../../certs:/certs:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  telemetry-service:
    build:
      context: ../../
      dockerfile: services/telemetry-service/Dockerfile
    container_name: argus-telemetry-service
    environment:
      - DATABASE_URL=postgres://argus:argus@postgres:5432/argus?sslmode=disable
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TELEMETRY_TOPIC=telemetry.raw
      - KAFKA_INCIDENT_TOPIC=telemetry.incidents
      - KAFKA_AI_WORKER_GROUP_ID=argus-ai-worker
      - CORE_SERVICE_GRPC_ADDR=core-service:50051
      - GRPC_PORT=50052
      - PORT=8081
      - EMBED_MODEL_PATH=/app/models/all-MiniLM-L6-v2
      - EMBED_DIMENSION=384
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MQTT_BROKER_URL=tcp://mosquitto:1883
    ports:
      - "50052:50052"
      - "8081:8081"
    depends_on:
      - postgres
      - redis
      - redpanda
      - mosquitto
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped


  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: argus-frontend
    ports:
      - "5173:80"
    depends_on:
      core-service:
        condition: service_healthy
    restart: always

volumes:
  argus_postgres_data:
  argus_redis_data:
  argus_minio_data:
  argus_prometheus_data:
  argus_loki_data:
  argus_grafana_data:
