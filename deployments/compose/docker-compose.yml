services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: argus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - argus_postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: argus-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  redpanda:
    image: redpandadata/redpanda:v24.3.5
    container_name: argus-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      - --set
      - log_retention_ms=3600000
    ports:
      - "${KAFKA_PORT:-9092}:9092"

  redis:
    image: redis:7-alpine
    container_name: argus-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - argus_redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: argus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-argus}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-arguspassword}
    ports:
      - "9002:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - argus_minio_data:/data

  caddy:
    image: caddy:2.9.1-alpine
    container_name: argus-caddy
    ports:
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../certs:/certs:ro
    depends_on:
      - minio

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: argus-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - argus_prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.3.2
    container_name: argus-loki
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - argus_loki_data:/loki

  promtail:
    image: grafana/promtail:3.3.2
    container_name: argus-promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: argus-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-argus}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - argus_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  argus_postgres_data:
  argus_redis_data:
  argus_minio_data:
  argus_prometheus_data:
  argus_loki_data:
  argus_grafana_data:
