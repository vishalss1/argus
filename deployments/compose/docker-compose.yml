services:
  postgres:
    image: postgres:16
    container_name: argus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - argus_postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: argus-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  redpanda:
    image: redpandadata/redpanda:v24.3.5
    container_name: argus-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:${KAFKA_PORT:-9092}
    ports:
      - "${KAFKA_PORT:-9092}:9092"

  redis:
    image: redis:7-alpine
    container_name: argus-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - argus_redis_data:/data

volumes:
  argus_postgres_data:
  argus_redis_data:
