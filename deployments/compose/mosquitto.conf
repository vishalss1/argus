# ARGUS Mosquitto Configuration (Local Dev / Docker Compose)
# SECURITY NOTE: allow_anonymous true is strictly enabled for local development and E2E benchmark tests.
# Production deployments mandate listener 8883 with mTLS (cafile/certfile/keyfile) or mosquitto_passwd auth plugin.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_inflight_messages 100
max_queued_messages 3600
max_connections 2000
log_type warning
log_type error
