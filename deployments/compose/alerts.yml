groups:
  - name: argus-operational-alerts
    rules:
      - alert: HighGrpcLatency
        expr: histogram_quantile(0.95, sum(rate(argus_grpc_request_duration_seconds_bucket[5m])) by (le, method)) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High gRPC Latency detected"
          description: "95th percentile gRPC latency for method {{ $labels.method }} is {{ $value }}s, exceeding the 1s threshold."

      - alert: HighErrorRate
        expr: (sum(rate(argus_grpc_requests_total{status="failure"}[5m])) / sum(rate(argus_grpc_requests_total[5m]))) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Elevated gRPC Error Rate"
          description: "Total gRPC error rate is {{ printf \"%.2f\" $value }}%, exceeding the 5% threshold."

      - alert: AIQueryLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(argus_ai_query_duration_seconds_bucket[5m])) by (le)) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High AI Query Latency"
          description: "95th percentile AI query duration is {{ $value }}s, exceeding the 5s threshold."
