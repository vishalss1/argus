global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"


scrape_configs:
  - job_name: argus-api
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: telemetry-service
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - telemetry-service:8081

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
