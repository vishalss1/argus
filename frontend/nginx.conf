server {
    listen 80;
    server_name localhost;

    # SPA fallback — serve index.html for all unmatched paths
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # core-service runs TLS (ListenAndServeTLS) inside Docker with a self-signed cert.
    # Proxy over HTTPS, but skip cert verification since the cert is self-signed.
    location /api {
        proxy_pass https://core-service:8080;
        proxy_ssl_verify off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Keep long-lived connections alive for WebSocket sessions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
