name: SDK CI

on:
  push:
    branches: [feat/sdk-dev, master]
  pull_request:
    branches: [feat/sdk-dev, master]

jobs:
  sdk-compile-check:
    name: Arduino Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Install libraries
        run: |
          arduino-cli lib install PubSubClient ArduinoJson
      - name: Generate stub sketch
        run: |
          mkdir -p /tmp/argus_compile_test
          cat > /tmp/argus_compile_test/argus_compile_test.ino << 'SKETCH'
          #include <argus.h>
          
          const char ARGUS_DEVICE_ID[] = "test-device-001";
          const char ARGUS_API_KEY[] = "test-api-key-placeholder";
          const char ARGUS_SERVER_HOST[] = "192.168.1.1";
          const uint16_t ARGUS_HTTP_PORT = 8080;
          const char ARGUS_MQTT_HOST[] = "192.168.1.1";
          const uint16_t ARGUS_MQTT_PORT = 1883;
          const char WIFI_SSID[] = "TestNetwork";
          const char WIFI_PASSWORD[] = "TestPassword";
          const char ARGUS_FW_VERSION[] = "1.0.0";
          const char ARGUS_OTA_KEY_ID[] = "test-key-id";
          const char ARGUS_OTA_PUBLIC_KEY_B64[] = "";
          const char ARGUS_ROOT_CA[] PROGMEM = "";
          const char ARGUS_DEVICE_CERT[] PROGMEM = "";
          const char ARGUS_DEVICE_PRIVATE_KEY[] PROGMEM = "";
          
          void setup() { Serial.begin(115200); argusBegin(); }
          void loop() { argusLoop(); }
          SKETCH
      - name: Compile for ESP32
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --libraries argus_sdk \
            /tmp/argus_compile_test

  sdk-integration-test:
    name: SDK Integration Test
    runs-on: ubuntu-latest
    needs: sdk-compile-check
    steps:
      - uses: actions/checkout@v4

      - name: Generate TLS certificates
        run: bash sdk_tests/ci/gen_certs.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Generate OTA signing keys
        run: |
          cd sdk_tests/bootstrap
          go run bootstrap.go --generate-ota-keys --ota-keys-output=../../ota_keys.env --ca-cert=../../certs/root-ca.pem

      - name: Create backend .env
        run: |
          source ota_keys.env
          cat > .env << EOF
          JWT_SECRET=ci-test-jwt-secret-$(openssl rand -hex 16)
          MINIO_ACCESS_KEY=argus
          MINIO_SECRET_KEY=arguspassword
          OTA_SIGNING_KEY_ID=${OTA_KEY_ID}
          OTA_SIGNING_PRIVATE_KEY_B64=${OTA_PRIVATE_KEY_B64}
          OTA_REQUIRE_SIGNATURES=true
          MINIO_PUBLIC_URL=https://localhost:9000
          MINIO_USE_SSL=true
          EOF

      - name: Start backend services
        run: |
          docker compose \
            -f deployments/compose/docker-compose.yml \
            -f sdk_tests/ci/docker-compose.ci.yml \
            up -d --build

      - name: Wait for core-service
        run: |
          echo "Waiting for core-service to be healthy..."
          for i in $(seq 1 60); do
            if curl -sf --cacert certs/root-ca.pem https://localhost:8080/healthz -o /dev/null 2>/dev/null; then
              echo "core-service is healthy"
              break
            fi
            echo "Attempt $i/60..."
            sleep 2
          done
          curl -sf --cacert certs/root-ca.pem https://localhost:8080/healthz -o /dev/null || (echo 'core-service not healthy after 120s'; docker compose -f deployments/compose/docker-compose.yml -f sdk_tests/ci/docker-compose.ci.yml logs core-service; exit 1)

      - name: Wait for Mosquitto
        run: |
          for i in $(seq 1 15); do
            if nc -z localhost 1883 2>/dev/null; then
              echo "Mosquitto is ready"
              break
            fi
            echo "Waiting for Mosquitto... attempt $i/15"
            sleep 2
          done
          nc -z localhost 1883 || (echo 'Mosquitto not ready after 30s'; exit 1)

      - name: Provision test device
        run: |
          cd sdk_tests/bootstrap
          go run bootstrap.go \
            --base-url=https://localhost:8080 \
            --ca-cert=../../certs/root-ca.pem \
            --output=device.env

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libssl-dev libmbedtls-dev cmake

      - name: Build SDK test binary
        run: |
          cmake sdk_tests/ -B sdk_tests/build
          cmake --build sdk_tests/build

      - name: Run integration test
        run: |
          set -a
          source sdk_tests/bootstrap/device.env
          set +a
          ./sdk_tests/build/argus_sdk_test

      - name: Cleanup test device
        if: always()
        run: |
          cd sdk_tests/bootstrap
          DEVICE_ID=$(cat device_id.txt 2>/dev/null || echo "")
          if [ -n "$DEVICE_ID" ]; then
            go run bootstrap.go \
              --cleanup \
              --device-id="$DEVICE_ID" \
              --base-url=https://localhost:8080 \
              --ca-cert=../../certs/root-ca.pem
          fi

      - name: Stop backend services
        if: always()
        run: |
          docker compose \
            -f deployments/compose/docker-compose.yml \
            -f sdk_tests/ci/docker-compose.ci.yml \
            down -v
