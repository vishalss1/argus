name: Go and React CI

on:
  push:
    branches: [ main, master, telemetry-redesign ]
  pull_request:
    branches: [ main, master, telemetry-redesign ]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Dependencies
        run: go mod download

      - name: Build CMDs
        run: |
          go build -v ./cmd/api
          go build -v ./cmd/ai-worker

      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.out ./...

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
