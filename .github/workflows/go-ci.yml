name: Go and React CI

on:
  push:
    branches: [ main, master, telemetry-redesign ]
  pull_request:
    branches: [ main, master, telemetry-redesign ]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'
          cache: true

      - name: Verify Dependencies
        run: |
          cd shared && go mod download
          cd ../services/core-service && go mod download
          cd ../telemetry-service && go mod download

      - name: Install ONNX Runtime 1.23.0
        run: |
          curl -sL -o onnxruntime.tgz "https://github.com/microsoft/onnxruntime/releases/download/v1.23.0/onnxruntime-linux-x64-1.23.0.tgz"
          tar -xzf onnxruntime.tgz
          sudo cp onnxruntime-linux-x64-1.23.0/lib/libonnxruntime.so.1.23.0 /usr/lib/libonnxruntime.so
          sudo ldconfig

      - name: Build CMDs
        run: |
          go build -v ./services/core-service/cmd/api
          go build -v ./services/telemetry-service/cmd

      - name: Run Tests
        run: |
          cd shared && go test -v -race ./...
          cd ../services/core-service && go test -v -race ./...
          cd ../telemetry-service && go test -v -race ./...

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
